name: Check Apple component regressions
on:
  push:
    branches: [codex/qwel-ios]
    paths: ['ios/**', '.github/workflows/qwel-apple-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-components:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Check Apple text, playback, persistence and backdrop sizing
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/QwelIos.xcodeproj -scheme QwelIos -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/AppleSimulator -parallel-testing-enabled NO -only-testing:QwelTests/AppleComponentTests -resultBundlePath build/AppleTests.xcresult CODE_SIGNING_ALLOWED=NO test > apple-tests.log 2>&1 || { tail -180 apple-tests.log; exit 1; }
          tail -45 apple-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apple-component-results
          path: |
            apple-tests.log
            build/AppleTests.xcresult
