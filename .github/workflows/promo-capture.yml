name: Capture Vexel product screens
on:
  push:
    branches: [codex/promo-showcase]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator app
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -project QwelIos.xcodeproj -scheme QwelIos -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/Promo CODE_SIGNING_ALLOWED=NO build > ../promo-build.log 2>&1 || { tail -100 ../promo-build.log; exit 1; }
      - name: Capture actual interface
        run: |
          mkdir -p build/screens
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Promo/Build/Products/Debug-iphonesimulator/QwelIos.app
          for MODE in home new editor add shapes components selected style color layers links export play; do
            xcrun simctl terminate "$DEVICE" com.matwey181.qwelios || true
            xcrun simctl launch "$DEVICE" com.matwey181.qwelios --promo-capture --promo-mode "$MODE" -AppleLanguages '(ru)' -AppleLocale ru_RU
            sleep 4
            xcrun simctl io "$DEVICE" screenshot "build/screens/$MODE.png"
          done
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 build/screens/play.mov &
          RECORDER_PID=$!
          sleep 6
          kill -INT "$RECORDER_PID"
          wait "$RECORDER_PID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vexel-product-captures
          path: |
            build/screens
            promo-build.log
