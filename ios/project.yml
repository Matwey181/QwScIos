name: QwelIos
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  QwelIos:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matwey181.qwelios
        PRODUCT_NAME: QwelIos
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "0.6.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QwelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: QwelIos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matwey181.qwelios.tests
  QwelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: QwelIos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matwey181.qwelios.uitests
        TEST_TARGET_NAME: QwelIos
schemes:
  QwelIos:
    build:
      targets:
        QwelIos: all
    test:
      config: Debug
      targets: [QwelTests, QwelUITests]
